name: Validate and build Windows app

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'tools/**'
      - 'build.bat'
      - '.github/workflows/**'
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly regression build. No physical USB/pedal interaction is possible in CI.
    - cron: '17 4 * * 1'

permissions:
  contents: read

concurrency:
  group: meca-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Verify preview does not contain device/registry write calls
        run: python3 tools/check_read_only.py
      - name: Run simulated and recorded-sweep checks
        run: dotnet run --project tests/GuidedCalibrationChecks.csproj --configuration Release

  windows-build:
    needs: verify
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Windows logic smoke checks
        run: dotnet run --project tests/GuidedCalibrationChecks.csproj --configuration Release
      - name: Build portable self-contained Windows executable
        run: dotnet publish src/MecaCalibrationWizard.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o release
      - name: Include printable field-test guide in Windows package
        shell: pwsh
        run: |
          Copy-Item PEDAL_TEST_QUICKSTART.md release/
          Copy-Item PEDAL_TEST_REPORT_TEMPLATE.md release/
          Copy-Item tools/START_PEDAL_TEST.cmd release/
      - name: Zip artifact
        shell: pwsh
        run: Compress-Archive -Path release/* -DestinationPath MecaCalibrationWizard-v0.2.3-win-x64.zip
      # CI always verifies and builds; only an explicitly requested run
      # uploads a package, preventing routine PR pushes from exhausting
      # artifact storage. Existing artifacts are preserved.
      - name: Upload verified Windows build
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: MecaCalibrationWizard-v0.2.3-win-x64
          path: MecaCalibrationWizard-v0.2.3-win-x64.zip
          retention-days: 14
          if-no-files-found: error
